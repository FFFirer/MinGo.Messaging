name: Release

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: "${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MinGo.Messaging.slnx

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Build
        run: dotnet build MinGo.Messaging.slnx --configuration Release

      - name: Test
        run: dotnet test MinGo.Messaging.slnx --no-build --configuration Release --verbosity normal

      - name: Pack SDK projects
        run: |
          dotnet pack src/Abstractions/MinGo.Messaging.Abstractions/MinGo.Messaging.Abstractions.csproj --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o artifacts
          dotnet pack src/Core/MinGo.Messaging.Core/MinGo.Messaging.Core.csproj --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o artifacts
          dotnet pack src/Hosting/MinGo.Messaging.Hosting/MinGo.Messaging.Hosting.csproj --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o artifacts
          dotnet pack src/RabbitMQ/MinGo.Messaging.RabbitMQ/MinGo.Messaging.RabbitMQ.csproj --no-build --configuration Release -p:PackageVersion=${{ steps.version.outputs.VERSION }} -o artifacts

      - name: Push to NuGet server
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "${{ env.NUGET_SOURCE }}" --skip-duplicate
